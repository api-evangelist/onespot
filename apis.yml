name: OneSpot
description: OneSpot was an Austin, Texas adtech and content-marketing startup that built a machine-learning
  platform to personalize and sequence branded content across websites, email, and paid media. Founded
  around 2010 and backed by early investors including 500 Startups, RSL Venture Partners, and Austin angels,
  it raised multiple venture rounds before being acquired. The onespot.com domain (and its developer, api,
  and app subdomains) now redirects to IgniteTech, and the company no longer operates an independent public
  developer API, documentation, or SDK surface.
